name: Python checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -c requirements-lock.txt -e ".[dev]"
      - run: python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest -q
      - run: python -m navdiag demo --navigation --with-gru --gru-epochs 3 --out artifacts/navigation_demo
      - run: python -m navdiag evaluate-agent --provider offline --artifacts artifacts/navigation_demo
      - run: python -m pip wheel . --no-deps --wheel-dir dist
