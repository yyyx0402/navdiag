[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "navdiag"
version = "0.2.0"
description = "A learning-first GNSS positioning quality and diagnostic toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "matplotlib>=3.9,<4",
  "joblib>=1.4,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
temporal = ["torch>=2.6,<3"]

[project.scripts]
navdiag = "navdiag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
navdiag = ["resources/*.json", "resources/dashboard/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
